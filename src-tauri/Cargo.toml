[package]
name = "nooki-desktop"
version = "1.0.0"
description = "Nooki Desktop - Floating Chibi Companion & Chat"
authors = ["Nooki Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

